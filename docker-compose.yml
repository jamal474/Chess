# Full stack for a VM deployment:
#   - cpp-engine: C++ chess game engine (Boost.Asio + nlohmann_json)
#   - node-server: socket.io relay between clients and the engine
#   - client: React SPA served by nginx at /chess/ (also proxies
#     /chess/socket.io/ to node)
#
# All three services declare `restart: unless-stopped` so they come back up
# on VM reboot or a container crash. `docker compose up -d` on a fresh VM
# is enough to run the whole thing.

services:
  cpp-engine:
    build:
      context: ./cppServer
      # Override the compile-time log floor at build time, e.g.
      #   docker compose build --build-arg CHESS_MIN_LOG_LEVEL=2
      args:
        CHESS_MIN_LOG_LEVEL: "0"
    container_name: chess-cpp-engine
    restart: unless-stopped
    environment:
      CHESS_ENGINE_PORT: "5000"
      CHESS_LOG_LEVEL: "INFO"
    expose:
      - "5000"
    networks:
      - chessnet

  node-server:
    build:
      context: ./server
    container_name: chess-node-server
    restart: unless-stopped
    environment:
      NODE_HOST: "0.0.0.0"
      NODE_PORT: "3000"
      CPP_HOST: "cpp-engine"
      CPP_PORT: "5000"
      ALLOWED_ORIGINS: "*"
      # Must match the path the browser asks for. The client is mounted at
      # /chess/ and nginx forwards the URI through unchanged.
      SOCKET_IO_PATH: "/chess/socket.io/"
    depends_on:
      - cpp-engine
    ports:
      # Direct-connect port (useful for debugging); nginx proxies for browsers.
      - "3000:3000"
    networks:
      - chessnet

  client:
    build:
      context: ./client
      args:
        # Empty means the client talks to whichever host it was loaded from
        # (nginx proxies <base>/socket.io/ to node-server on the private
        # network).
        VITE_SERVER_URL: ""
        # Mount path. Feeds the Vite build, the directory the bundle is copied
        # into, and the nginx locations — one value, no drift.
        APP_BASE: "/chess"
    container_name: chess-client
    restart: unless-stopped
    environment:
      # nginx template picks these up on start to wire the proxy_pass.
      PORT: "80"
      APP_BASE: "/chess"
      NODE_HOST: "node-server"
      NODE_PORT: "3000"
    depends_on:
      - node-server
    ports:
      - "8080:80"
    networks:
      - chessnet

networks:
  chessnet:
    driver: bridge
