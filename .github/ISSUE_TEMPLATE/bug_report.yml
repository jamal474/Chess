name: Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. The more detail you give, the faster it can be fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the moves played if it's a rules bug (e.g. "1. e4 e5 2. Qh5 ...").
      placeholder: |
        1. Create a room
        2. Join from a second tab
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part seems affected?
      options:
        - Gameplay / chess rules
        - Board UI
        - Rooms / connecting
        - Chat
        - Deployment / Docker / Railway
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did you see it?
      options:
        - Live site
        - Local development (make run)
        - Docker Compose
        - Railway
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 129 on macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Browser console errors, server logs or screenshots.
      render: shell
