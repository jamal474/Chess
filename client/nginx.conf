# Chess client — static SPA plus a passthrough to the node relay.
# The node server hostname is set by docker-compose to "node-server".

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: any not-found route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Socket.IO + REST proxied to the node relay.
  location /socket.io/ {
    proxy_pass http://node-server:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }

  location /healthz {
    proxy_pass http://node-server:3000/healthz;
    proxy_set_header Host $host;
  }
}
